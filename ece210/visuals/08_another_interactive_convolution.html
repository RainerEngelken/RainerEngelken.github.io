<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECE 210: Continuous Convolution Visualization</title>
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: #1e1e1e;
            --text-color: #eeeeee;
            --f-color: #4285F4;    /* Vibrant Blue */
            --h-color: #E84A27;    /* UIUC Orange */
            --y-color: #34A853;    /* 3b1b Green */
            --grid-color: #333333;
            --axis-color: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-weight: 400;
        }

        .math {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.3rem;
            letter-spacing: 1px;
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
        }

        .controls {
            background-color: var(--panel-bg);
            padding: 15px 30px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: #444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        button:hover { background-color: #555; }
        button:active { background-color: #333; }

        select {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
        }

        input[type=range] {
            width: 300px;
            cursor: pointer;
        }

        .canvas-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .plot-wrapper {
            position: relative;
        }

        .plot-label {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            text-shadow: 1px 1px 2px black;
        }

        canvas {
            background-color: var(--panel-bg);
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: block;
        }

        .c-blue { color: var(--f-color); }
        .c-orange { color: var(--h-color); }
        .c-green { color: var(--y-color); }
    </style>
</head>
<body>

    <div class="header">
        <h1>ECE 210: Convolution Visualization</h1>
        <div class="math">
            <span class="c-green">y(t)</span> = ∫<sub>-∞</sub><sup>∞</sup> 
            <span class="c-blue">f(τ)</span> <span class="c-orange">h(t - τ)</span> dτ
        </div>
    </div>

    <div class="controls">
        <select id="exampleSelect">
            <option value="0">Ex 1: Triangle &amp; Staircase (Slide 4)</option>
            <option value="1">Ex 2: Two Rectangles (Slide 19)</option>
            <option value="2">Ex 3: Rect &amp; Exponential (Slide 8)</option>
        </select>
        
        <button id="playBtn">▶ Play</button>

        <div class="slider-container">
            <span>Slide <i>t</i> : </span>
            <input type="range" id="tSlider" min="-3" max="6" step="0.02" value="-2.5">
            <span id="tValue" style="width: 60px; text-align: right; font-weight: bold;">t = -2.50</span>
        </div>
    </div>

    <div class="canvas-container">
        <!-- Plot 1: f(tau) and h(t - tau) -->
        <div class="plot-wrapper">
            <div class="plot-label">
                <span class="c-blue math">f(τ)</span> and 
                <span class="c-orange math">h(t - τ)</span>
            </div>
            <canvas id="canvas1" width="900" height="180"></canvas>
        </div>

        <!-- Plot 2: Product -->
        <div class="plot-wrapper">
            <div class="plot-label">
                Product: <span class="c-blue math">f(τ)</span> × <span class="c-orange math">h(t - τ)</span>
            </div>
            <canvas id="canvas2" width="900" height="180"></canvas>
        </div>

        <!-- Plot 3: Convolution Result -->
        <div class="plot-wrapper">
            <div class="plot-label">
                Result: <span class="c-green math">y(t)</span>
            </div>
            <canvas id="canvas3" width="900" height="180"></canvas>
        </div>
    </div>

<script>
    // --- Configuration & State ---
    const config = {
        minX: -3, maxX: 6,
        minY: -0.2, maxY: 1.6,
        dTau: 0.005  // Integration / drawing step size
    };

    let currentT = -2.5;
    let isPlaying = false;
    let animationId;
    let yData = []; // Precomputed y(t)

    // --- Signal Definitions ---
    const examples = [
        {
            // ECE 210 Slide 4
            f: (t) => (t >= 0 && t <= 1) ? t : ((t > 1 && t <= 2) ? 2 - t : 0),
            h: (t) => (t >= -2 && t < -1) ? 0.5 : ((t >= -1 && t <= 1) ? 1.0 : 0)
        },
        {
            // ECE 210 Slide 19 (Rect * Rect)
            f: (t) => (Math.abs(t - 1) <= 1) ? 1 : 0, 
            h: (t) => (Math.abs(t - 1) <= 1) ? 1 : 0
        },
        {
            // ECE 210 Slide 8 equivalent (Rect * Exp)
            f: (t) => (t >= 0 && t <= 2) ? 1.0 : 0,
            h: (t) => (t >= 0) ? Math.exp(-t) : 0
        }
    ];

    let currentEx = examples[0];

    // --- DOM Elements ---
    const canvas1 = document.getElementById('canvas1');
    const canvas2 = document.getElementById('canvas2');
    const canvas3 = document.getElementById('canvas3');
    const ctx1 = canvas1.getContext('2d');
    const ctx2 = canvas2.getContext('2d');
    const ctx3 = canvas3.getContext('2d');
    
    const tSlider = document.getElementById('tSlider');
    const tValueDisplay = document.getElementById('tValue');
    const playBtn = document.getElementById('playBtn');
    const exampleSelect = document.getElementById('exampleSelect');

    // --- Math & Precomputation ---
    function precomputeY() {
        yData = [];
        // Precompute y(t) for all t in slider range to draw the trace line
        for(let t = config.minX; t <= config.maxX; t += 0.02) {
            let sum = 0;
            for(let tau = config.minX; tau <= config.maxX; tau += config.dTau) {
                sum += currentEx.f(tau) * currentEx.h(t - tau) * config.dTau;
            }
            yData.push({ t: t, y: sum });
        }
    }

    // --- Drawing Helpers ---
    function mapX(x, width) {
        return (x - config.minX) / (config.maxX - config.minX) * width;
    }

    function mapY(y, height) {
        return height - ((y - config.minY) / (config.maxY - config.minY) * height);
    }

    function drawAxes(ctx, width, height) {
        ctx.clearRect(0, 0, width, height);
        ctx.lineWidth = 1;
        
        // Grid lines and ticks
        ctx.strokeStyle = '#333333';
        ctx.fillStyle = '#888888';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        
        for(let x = Math.ceil(config.minX); x <= Math.floor(config.maxX); x++) {
            let px = mapX(x, width);
            ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, height); ctx.stroke();
            if (x !== 0) ctx.fillText(x, px, mapY(0, height) + 15);
        }

        // X and Y axis
        ctx.strokeStyle = '#888888';
        ctx.beginPath();
        let yZero = mapY(0, height);
        ctx.moveTo(0, yZero); ctx.lineTo(width, yZero);
        let xZero = mapX(0, width);
        ctx.moveTo(xZero, 0); ctx.lineTo(xZero, height);
        ctx.stroke();
    }

    function drawFunction(ctx, width, height, func, colorRGB, fillAlpha, isH = false) {
        ctx.beginPath();
        ctx.moveTo(mapX(config.minX, width), mapY(0, height));
        
        for(let x = config.minX; x <= config.maxX; x += config.dTau) {
            let yVal = isH ? func(currentT - x) : func(x);
            ctx.lineTo(mapX(x, width), mapY(yVal, height));
        }
        
        ctx.lineTo(mapX(config.maxX, width), mapY(0, height));
        
        // Fill
        ctx.fillStyle = `rgba(${colorRGB}, ${fillAlpha})`;
        ctx.fill();
        
        // Stroke
        ctx.strokeStyle = `rgb(${colorRGB})`;
        ctx.lineWidth = 2.5;
        ctx.stroke();
    }

    // --- Main Render Loop ---
    function render() {
        const w = canvas1.width;
        const h = canvas1.height;

        // 1. Draw Canvas 1: f(tau) and h(t - tau)
        drawAxes(ctx1, w, h);
        drawFunction(ctx1, w, h, currentEx.f, '66, 133, 244', 0.2); // Blue f
        drawFunction(ctx1, w, h, currentEx.h, '232, 74, 39', 0.2, true); // Orange h
        
        // Draw vertical dashed line indicating the anchor 't' of the sliding function
        ctx1.setLineDash([5, 5]);
        ctx1.strokeStyle = 'rgba(232, 74, 39, 0.8)';
        ctx1.beginPath();
        ctx1.moveTo(mapX(currentT, w), mapY(0, h));
        ctx1.lineTo(mapX(currentT, w), mapY(config.maxY, h));
        ctx1.stroke();
        ctx1.setLineDash([]);
        ctx1.fillStyle = '#E84A27';
        ctx1.fillText("t", mapX(currentT, w) + 10, 20);

        // 2. Draw Canvas 2: Product
        drawAxes(ctx2, w, h);
        const productFunc = (tau) => currentEx.f(tau) * currentEx.h(currentT - tau);
        drawFunction(ctx2, w, h, productFunc, '52, 168, 83', 0.5); // Green Product

        // 3. Draw Canvas 3: Convolution y(t)
        drawAxes(ctx3, w, h);
        
        // Draw faint full path
        ctx3.beginPath();
        ctx3.moveTo(mapX(yData[0].t, w), mapY(yData[0].y, h));
        for(let i=1; i<yData.length; i++) {
            ctx3.lineTo(mapX(yData[i].t, w), mapY(yData[i].y, h));
        }
        ctx3.strokeStyle = 'rgba(52, 168, 83, 0.3)';
        ctx3.lineWidth = 2;
        ctx3.stroke();

        // Draw solid active path up to currentT
        ctx3.beginPath();
        ctx3.moveTo(mapX(yData[0].t, w), mapY(yData[0].y, h));
        let currentY = 0;
        for(let i=1; i<yData.length; i++) {
            if(yData[i].t <= currentT) {
                ctx3.lineTo(mapX(yData[i].t, w), mapY(yData[i].y, h));
                currentY = yData[i].y;
            } else {
                break;
            }
        }
        ctx3.strokeStyle = '#34A853';
        ctx3.lineWidth = 3;
        ctx3.stroke();

        // Draw glowing dot at current (t, y)
        let dotX = mapX(currentT, w);
        let dotY = mapY(currentY, h);
        
        ctx3.setLineDash([4, 4]);
        ctx3.strokeStyle = 'rgba(52, 168, 83, 0.6)';
        ctx3.beginPath();
        ctx3.moveTo(dotX, mapY(0, h));
        ctx3.lineTo(dotX, dotY);
        ctx3.stroke();
        ctx3.setLineDash([]);

        ctx3.beginPath();
        ctx3.arc(dotX, dotY, 6, 0, Math.PI * 2);
        ctx3.fillStyle = '#34A853';
        ctx3.fill();
        ctx3.shadowBlur = 10;
        ctx3.shadowColor = '#34A853';
        ctx3.fill();
        ctx3.shadowBlur = 0; // reset
    }

    // --- Interaction & Animation ---
    function updateT(val) {
        currentT = parseFloat(val);
        tValueDisplay.innerHTML = `t = ${currentT.toFixed(2)}`;
        tSlider.value = currentT;
        render();
    }

    tSlider.addEventListener('input', (e) => {
        if(isPlaying) togglePlay(); // Pause if user takes control
        updateT(e.target.value);
    });

    exampleSelect.addEventListener('change', (e) => {
        currentEx = examples[parseInt(e.target.value)];
        precomputeY();
        render();
    });

    function togglePlay() {
        isPlaying = !isPlaying;
        playBtn.innerText = isPlaying ? "⏸ Pause" : "▶ Play";
        if(isPlaying) animate();
        else cancelAnimationFrame(animationId);
    }

    function animate() {
        currentT += 0.02;
        if(currentT > config.maxX) {
            currentT = config.minX; // Loop back
        }
        updateT(currentT);
        if(isPlaying) {
            animationId = requestAnimationFrame(animate);
        }
    }

    playBtn.addEventListener('click', togglePlay);

    // --- Initialization ---
    precomputeY();
    updateT(currentT);

</script>

</body></html>
