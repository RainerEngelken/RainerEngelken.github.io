<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fourier Series Visualization - ECE 210</title>
    
    <!-- Plotly for plotting, MathJax for rendering equations -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            /* UIUC Official Colors */
            --illini-orange: #E84A27;
            --illini-blue: #13294B;
            --light-bg: #F8F9FA;
            --border-color: #DEE2E6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333;
        }

        header {
            background-color: var(--illini-blue);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid var(--illini-orange);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header h2 {
            margin: 5px 0 0 0;
            font-size: 16px;
            font-weight: 400;
            color: #D2E0E9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .controls-card {
            background-color: var(--light-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: bold;
            color: var(--illini-blue);
        }

        select {
            padding: 8px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            outline: none;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type=range] {
            width: 250px;
            accent-color: var(--illini-orange);
        }

        .n-badge {
            background-color: var(--illini-orange);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            min-width: 50px;
            text-align: center;
        }

        .info-panel {
            background-color: #e9f2fb;
            border-left: 5px solid var(--illini-blue);
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            font-size: 16px;
            line-height: 1.5;
        }

        .plots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .plot-container {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        @media (max-width: 900px) {
            .plots-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Fourier Series Visualization</h1>
    <h2>ECE 210: Analog Signal Processing — University of Illinois Urbana-Champaign</h2>
</header>

<div class="container">
    
    <!-- Controls -->
    <div class="controls-card">
        <div class="control-group">
            <label for="signalType">Select Signal Function, x(t):</label>
            <select id="signalType">
                <option value="square">Square Wave</option>
                <option value="sawtooth">Sawtooth Wave</option>
                <option value="triangle">Triangle Wave</option>
                <option value="sine">Pure Sine Wave</option>
            </select>
        </div>

        <div class="control-group">
            <label for="nSlider">Number of Fourier Modes (Harmonics), N:</label>
            <div class="slider-container">
                <input type="range" id="nSlider" min="1" max="50" value="3" step="1">
                <div class="n-badge" id="nDisplay">N = 3</div>
            </div>
        </div>
    </div>

    <!-- Pedagogical Explanation Panel -->
    <div class="info-panel" id="infoPanel">
        <!-- Injected via JS -->
    </div>

    <!-- Plots -->
    <div class="plots-grid">
        <div class="plot-container">
            <div id="timeDomainPlot"></div>
        </div>
        <div class="plot-container">
            <div id="freqDomainPlot"></div>
        </div>
    </div>

</div>

<script>
    // --- Configuration & Constants ---
    const MAX_N = 50;
    const NUM_POINTS = 1000;
    const ILLINI_ORANGE = '#E84A27';
    const ILLINI_BLUE = '#13294B';
    const GREY = '#D3D3D3';

    // Generate time vector t from -2*pi to 2*pi
    let t =[];
    for(let i=0; i<=NUM_POINTS; i++) {
        t.push(-2 * Math.PI + (4 * Math.PI * i / NUM_POINTS));
    }

    // --- Signal Definitions & Fourier Coefficients ---
    // All functions are normalized and have DC offset (a0) = 0 for simplicity.
    const signals = {
        sine: {
            evalFn: (tau) => Math.sin(tau),
            getAk: (k) => 0,
            getBk: (k) => k === 1 ? 1 : 0,
            desc: `<strong>Pure Sine Wave:</strong> The simplest signal. It contains only the fundamental frequency ($k=1$). All other Fourier coefficients are zero.<br><br>
                   \\[ x(t) = \\sin(t) \\]`
        },
        square: {
            evalFn: (tau) => Math.sign(Math.sin(tau)),
            getAk: (k) => 0,
            getBk: (k) => (k % 2 !== 0) ? 4 / (k * Math.PI) : 0,
            desc: `<strong>Square Wave:</strong> Exhibits <em>odd symmetry</em> ($a_k = 0$) and <em>half-wave symmetry</em>, meaning only odd harmonics ($k=1, 3, 5...$) exist. Notice the <strong>Gibbs phenomenon</strong>: the ~9% overshoot at the discontinuities never disappears, even as $N \\to \\infty$. The coefficients decay as $1/k$.<br><br>
                   \\[ x(t) \\approx \\frac{4}{\\pi} \\sum_{k=1,3,5...}^{N} \\frac{1}{k} \\sin(kt) \\]`
        },
        sawtooth: {
            evalFn: (tau) => {
                let wrapped = (tau + Math.PI) % (2 * Math.PI);
                if (wrapped < 0) wrapped += 2 * Math.PI;
                return (wrapped / Math.PI) - 1;
            },
            getAk: (k) => 0,
            getBk: (k) => (2 / (k * Math.PI)) * Math.pow(-1, k + 1),
            desc: `<strong>Sawtooth Wave:</strong> Exhibits <em>odd symmetry</em> ($a_k = 0$), so it only consists of sine terms. Unlike the square wave, it lacks half-wave symmetry and thus contains both even and odd harmonics. The coefficients decay at a rate of $1/k$.<br><br>
                   \\[ x(t) \\approx \\frac{2}{\\pi} \\sum_{k=1}^{N} \\frac{(-1)^{k+1}}{k} \\sin(kt) \\]`
        },
        triangle: {
            evalFn: (tau) => {
                let wrapped = tau % (2 * Math.PI);
                if (wrapped < 0) wrapped += 2 * Math.PI;
                if (wrapped < Math.PI / 2) return wrapped / (Math.PI / 2);
                else if (wrapped < 3 * Math.PI / 2) return 2 - wrapped / (Math.PI / 2);
                else return -4 + wrapped / (Math.PI / 2);
            },
            getAk: (k) => 0,
            getBk: (k) => {
                if (k % 2 === 0) return 0;
                let sign = ((k - 1) / 2) % 2 === 0 ? 1 : -1;
                return (8 / (Math.PI * Math.PI * k * k)) * sign;
            },
            desc: `<strong>Triangle Wave:</strong> This specific zero-mean triangle wave has <em>odd symmetry</em> and <em>half-wave symmetry</em>, containing only odd sine harmonics. Because the signal is continuous, its coefficients decay much faster, at a rate of $1/k^2$. Notice how quickly the Fourier series converges without Gibbs phenomenon!<br><br>
                   \\[ x(t) \\approx \\frac{8}{\\pi^2} \\sum_{k=1,3,5...}^{N} \\frac{(-1)^{\\frac{k-1}{2}}}{k^2} \\sin(kt) \\]`
        }
    };

    // --- State Variables ---
    let currentType = 'square';
    let currentN = 3;

    // --- Core Logic ---
    function computeApproximation(type, N) {
        let sig = signals[type];
        return t.map(ti => {
            let sum = 0;
            for(let k = 1; k <= N; k++) {
                sum += sig.getAk(k) * Math.cos(k * ti) + sig.getBk(k) * Math.sin(k * ti);
            }
            return sum;
        });
    }

    function getFrequencyData(type, N) {
        let sig = signals[type];
        let k_vals =[];
        let mags = [];
        let colors =[];
        
        // Include DC (k=0)
        k_vals.push(0);
        mags.push(0);
        colors.push(0 <= N ? ILLINI_ORANGE : GREY);

        for(let k = 1; k <= MAX_N; k++) {
            k_vals.push(k);
            let ak = sig.getAk(k);
            let bk = sig.getBk(k);
            mags.push(Math.sqrt(ak*ak + bk*bk));
            // Highlight active modes in Orange, inactive in Grey
            colors.push(k <= N ? ILLINI_ORANGE : GREY); 
        }
        return { k_vals, mags, colors };
    }

    // --- Plotly Initialization ---
    let timeLayout = {
        title: 'Time Domain: Signal vs. Fourier Sum',
        xaxis: { 
            title: 'Time (t)', 
            tickvals:[-2*Math.PI, -Math.PI, 0, Math.PI, 2*Math.PI], 
            ticktext:['-2π', '-π', '0', 'π', '2π'],
            gridcolor: '#eee'
        },
        yaxis: { 
            title: 'Amplitude x(t)', 
            range: [-1.8, 1.8],
            gridcolor: '#eee'
        },
        margin: { t: 50, b: 50, l: 50, r: 20 },
        legend: { orientation: 'h', y: 1.1, x: 0.5, xanchor: 'center' },
        plot_bgcolor: 'white',
        paper_bgcolor: 'white'
    };

    let freqLayout = {
        title: 'Frequency Domain: Magnitude Spectrum |c_k|',
        xaxis: { 
            title: 'Harmonic Number (k)', 
            range:[-0.5, MAX_N + 0.5],
            gridcolor: '#eee'
        },
        yaxis: { 
            title: 'Magnitude |c_k|', 
            range: [0, 1.4],
            gridcolor: '#eee'
        },
        margin: { t: 50, b: 50, l: 50, r: 20 },
        plot_bgcolor: 'white',
        paper_bgcolor: 'white'
    };

    let config = { responsive: true, displayModeBar: false };

    Plotly.newPlot('timeDomainPlot',[], timeLayout, config);
    Plotly.newPlot('freqDomainPlot',[], freqLayout, config);

    // --- Update Function ---
    function updateVisualization() {
        let trueSignal = t.map(signals[currentType].evalFn);
        let approxSignal = computeApproximation(currentType, currentN);
        let freqData = getFrequencyData(currentType, currentN);

        // Update Time Plot
        let traceTrue = {
            x: t,
            y: trueSignal,
            name: 'True Signal',
            line: { color: ILLINI_BLUE, width: 2, dash: 'dot' },
            type: 'scatter'
        };

        let traceApprox = {
            x: t,
            y: approxSignal,
            name: `Fourier Sum (N=${currentN})`,
            line: { color: ILLINI_ORANGE, width: 3 },
            type: 'scatter'
        };

        Plotly.react('timeDomainPlot', [traceTrue, traceApprox], timeLayout);

        // Update Frequency Plot (Stem Plot style)
        let traceFreq = {
            x: freqData.k_vals,
            y: freqData.mags,
            type: 'bar',
            name: '|c_k|',
            marker: { color: freqData.colors },
            width: 0.4
        };

        Plotly.react('freqDomainPlot', [traceFreq], freqLayout);

        // Update Text Panel
        const panel = document.getElementById('infoPanel');
        panel.innerHTML = signals[currentType].desc;
        
        // Re-render MathJax asynchronously 
        if (window.MathJax) {
            MathJax.typesetPromise([panel]).catch(function (err) {
                console.error('MathJax error: ', err.message);
            });
        }
    }

    // --- Event Listeners ---
    document.getElementById('nSlider').addEventListener('input', function(e) {
        currentN = parseInt(e.target.value);
        document.getElementById('nDisplay').innerText = `N = ${currentN}`;
        updateVisualization();
    });

    document.getElementById('signalType').addEventListener('change', function(e) {
        currentType = e.target.value;
        updateVisualization();
    });

    // Initial render
    window.onload = () => {
        updateVisualization();
    };

</script>
</body>
</html>
